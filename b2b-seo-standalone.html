      // Search & Input state
      const [searchQuery, setSearchQuery] = useState('');
      const [newSeedInput, setNewSeedInput] = useState('');

      // Run new research
      const handleRunResearch = (targetSeed) => {
        const seed = (targetSeed || newSeedInput || seedKeyword).trim();
        if (!seed) return;
        setIsLoading(true);
        setTimeout(() => {
          const newData = generateB2bDataset(seed);
          setSeedKeyword(seed);
          setMatrix(newData.matrix);
          setKeywords(newData.keywords);
          setPillars(newData.pillars);
          setContentMap(newData.contentMap);
          setSemanticReport(newData.semanticReport);
          setOutline(newData.outline);
          setCompetitorGap(newData.competitorGap);
          setIsLoading(false);
          setActiveTab('matrix');
        }, 350);
      };

      // Add item to 9D matrix & sync
      const handleAddMatrixItem = (colKey, text) => {
        if (!text || !text.trim()) return;
        const term = text.trim();
        setMatrix(prev => ({
          ...prev,
          [colKey]: [...(prev[colKey] || []), term]
        }));

        // Add to keywords
        const newKw = {
          id: `kw-${Date.now()}`,
          keyword: `${seedKeyword} ${term}`,
          seedKeyword: seedKeyword,
          volume: Math.floor(Math.random() * 800) + 200,
          kd: Math.floor(Math.random() * 20) + 10,
          cpc: 6000,
          intent: 'Commercial Investigation',
          category: 'Biến thể',
          parentTopic: `Cụm ${term}`,
          primaryKeyword: `${seedKeyword} ${term}`,
          isPrimary: false,
          topic: `Giải pháp ${term}`,
          pillar: pillars[0]?.pillar || `Hệ thống ${seedKeyword}`,
          cluster: `Cụm ${term}`,
          isLocal: colKey === 'locations',
          isBrand: colKey === 'brands',
          serpSimilarity: 85,
          opportunityScore: 92,
          businessRelevance: 95,
          funnelStage: 'MOFU',
          priority: 'P1',
          dataSource: 'AI ESTIMATE',
          confidence: 'High',
          suggestedContentType: 'Product Page',
          suggestedUrl: `/${seedKeyword.replace(/\s+/g, '-')}-${term.replace(/\s+/g, '-')}`,
        };
        setKeywords(prev => [newKw, ...prev]);
      };

      // Delete item from matrix
      const handleDeleteMatrixItem = (colKey, term) => {
        setMatrix(prev => ({
          ...prev,
          [colKey]: (prev[colKey] || []).filter(t => t !== term)
        }));
      };

      // Generate Auto Combinations in 9D matrix
      const handleGenerateCombinations = () => {
        const variants = (matrix.productVariants || []).slice(0, 2);
        const specs = (matrix.specifications || []).slice(0, 2);
        const locs = (matrix.locations || []).slice(0, 2);
        variants.forEach(v => {
          specs.forEach(s => handleAddMatrixItem('productVariants', `${v} ${s.replace(seedKeyword, '').trim()}`));
          locs.forEach(l => handleAddMatrixItem('productVariants', `${v} ${l.replace(seedKeyword, '').trim()}`));
        });
      };

      // Export helper
      const downloadFile = (content, filename, type) => {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const exportCSV = (data, filename) => {
        if (!data || !data.length) return;
        const headers = Object.keys(data[0]);
        const csvRows = [headers.join(',')];
        data.forEach(row => {
          const values = headers.map(h => {
            const val = row[h];
            if (Array.isArray(val)) return `"${val.join('; ')}"`;
            return `"${String(val ?? '').replace(/"/g, '""')}"`;
          });
          csvRows.push(values.join(','));
        });
        downloadFile('\uFEFF' + csvRows.join('\n'), `${filename}.csv`, 'text/csv;charset=utf-8;');
      };

                        <h2 className="text-xl font-black text-slate-900">Bản Đồ Kế Hoạch Nội Dung (Content Map)</h2>
                        <p className="text-xs text-slate-500">Lộ trình bài viết đề xuất kèm kiểm tra rủi ro Cannibalization (ăn thịt từ khóa).</p>

                      <div className="space-y-3">

                                Rủi ro: Không có ({c.cannibalizationRisk})

                            </div>
                          </div>

                  {/* TAB 7: EXPORT CENTER */}
                  {activeTab === 'export' && (
                    <div className="space-y-5 animate-fadeIn max-w-4xl mx-auto">
                      <div>
                        <h2 className="text-xl font-black text-slate-900">Trung Tâm Xuất Dữ Liệu Toàn Diện</h2>
                        <p className="text-xs text-slate-500">Tải trọn bộ dữ liệu nghiên cứu về máy tính với chuẩn mã hóa UTF-8 BOM tiếng Việt.</p>
                      </div>

                      <div className="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs space-y-4">
                        <h3 className="font-bold text-sm text-slate-800">Các Tùy Chọn Tải Dữ Liệu:</h3>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <button
                            onClick={() => exportCSV(keywords, `Keywords_${seedKeyword}`)}
                            className="p-4 bg-slate-50 hover:bg-blue-50/50 rounded-xl border border-slate-200 text-left transition-all space-y-1"
                          >
                            <div className="font-bold text-xs text-slate-900 flex items-center gap-2">
                              <Icon name="fileText" className="w-4 h-4 text-blue-600" />
                              <span>Xuất Danh Sách Từ Khóa (.CSV)</span>
                            </div>
                            <p className="text-[11px] text-slate-500">Đầy đủ {keywords.length} từ khóa, Opportunity Score và Search Intent.</p>
                          </button>

                          <button
                            onClick={() => exportCSV(pillars, `Pillars_${seedKeyword}`)}
                            className="p-4 bg-slate-50 hover:bg-blue-50/50 rounded-xl border border-slate-200 text-left transition-all space-y-1"
                          >
                            <div className="font-bold text-xs text-slate-900 flex items-center gap-2">
                              <Icon name="layers" className="w-4 h-4 text-purple-600" />
                              <span>Xuất Kiến Trúc Trụ Cột (.CSV)</span>
                            </div>
                            <p className="text-[11px] text-slate-500">Danh sách các Pillar và Cluster chuyên sâu.</p>
                          </button>

                          <button
                            onClick={() => {
                              const backup = {
                                seedKeyword,
                                matrix,
                                keywords,
                                pillars,
                                contentMap,
                                semanticReport,
                                outline,
                              };
                              downloadFile(JSON.stringify(backup, null, 2), `Project_Backup_${seedKeyword}.json`, 'application/json');
                            }}
                            className="p-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl border border-slate-800 text-left transition-all space-y-1 col-span-1 sm:col-span-2"
                          >
                            <div className="font-bold text-xs text-blue-300 flex items-center gap-2">
                              <Icon name="download" className="w-4 h-4 text-blue-400" />
                              <span>Sao Lưu Toàn Bộ Dự Án (.JSON Backup)</span>
                            </div>
                            <p className="text-[11px] text-slate-400">Gói gọn toàn bộ dữ liệu gồm ma trận, outline, semantic entities và từ khóa.</p>

    }

    // --- OUTLINE BUILDER SUB-COMPONENT (DUAL MODE) ---
    function OutlineBuilderComponent({ outline, setOutline, seedKeyword, downloadFile }) {
      const [activeMode, setActiveMode] = useState('keyword');
      const [customKeyword, setCustomKeyword] = useState(seedKeyword);
      const [copiedMd, setCopiedMd] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);

      // Custom H2/H3 state
      const [customH2List, setCustomH2List] = useState([
        { id: '1', title: `1. Tổng quan cấu tạo & nguyên lý hoạt động của ${seedKeyword}`, subheadings: [] },
        { id: '2', title: `2. Tiêu chuẩn kỹ thuật cơ khí & lựa chọn vật liệu Inox 304`, subheadings: [] },
        { id: '3', title: `3. Báo giá gia công theo yêu cầu tại xưởng sản xuất`, subheadings: [] },
        { id: '4', title: `4. Tiêu chí lựa chọn xưởng chế tạo uy tín và chế độ bảo hành`, subheadings: [] },
      ]);
      const [newH3Input, setNewH3Input] = useState({});

      const handleAddH2 = () => {
        setCustomH2List(prev => [
          ...prev,
          { id: String(Date.now()), title: `${prev.length + 1}. Tiêu đề thẻ H2 mới`, subheadings: [] }
        ]);
      };

      const handleRemoveH2 = (id) => {
        setCustomH2List(prev => prev.filter(h => h.id !== id));
      };

      const handleAddH3 = (h2Id) => {
        const text = (newH3Input[h2Id] || '').trim();
        if (!text) return;
        setCustomH2List(prev => prev.map(h => {
          if (h.id === h2Id) {
            return { ...h, subheadings: [...h.subheadings, text] };
          }
          return h;
        }));
        setNewH3Input(prev => ({ ...prev, [h2Id]: '' }));
      };

      const handleRemoveH3 = (h2Id, idx) => {
        setCustomH2List(prev => prev.map(h => {
          if (h.id === h2Id) {
            return { ...h, subheadings: h.subheadings.filter((_, i) => i !== idx) };
          }
          return h;
        }));
      };

      // Trigger generate (simulated high quality client-side generator)
      const handleGenerateOutline = () => {
        setIsGenerating(true);
        setTimeout(() => {
          if (activeMode === 'custom_headings') {
            // Intelligent auto-expansion of H2s into H3s and detailed points!
            const expandedHeadings = customH2List.map(h => {
              const autoSubs = h.subheadings.length > 0
                ? h.subheadings.map(sub => ({
                    level: 'H3',
                    title: sub,
                    keyPoints: [
                      `Thông số kỹ thuật và vật liệu chế tạo liên quan đến ${sub}`,
                      `Quy trình vận hành, tiêu chuẩn an toàn thực tế tại nhà xưởng`,
                    ]
                  }))
                : [
                    {
                      level: 'H3',
                      title: `Chi tiết kỹ thuật & Nguyên lý vận hành: ${h.title}`,
                      keyPoints: [
                        `Cấu tạo cơ khí, động cơ giảm tốc và vật liệu chịu tải chuyên dụng`,
                        `Dải công suất, tốc độ điều khiển vô cấp và khả năng tích hợp dây chuyền`,
                      ]
                    },
                    {
                      level: 'H3',
                      title: `Tiêu chuẩn nghiệm thu & Kinh nghiệm thực tế cho ${seedKeyword}`,
                      keyPoints: [
                        `Khảo sát mặt bằng lắp đặt, độ dốc và không gian thao tác`,
                        `Giải pháp tối ưu điện năng tiêu thụ và giảm hao hụt nguyên vật liệu`,
                      ]
                    }
                  ];

              return {
                level: 'H2',
                title: h.title,
                targetKeywords: [seedKeyword],
                intentTarget: `Giải đáp chuyên sâu về ${h.title} cho kỹ sư và quản đốc`,
                keyPoints: [
                  `Phân tích các yếu tố kỹ thuật cốt lõi của ${h.title}`,
                  `Giải quyết triệt để rủi ro hao hụt, kẹt liệu và gián đoạn dây chuyền`,
                  `Khuyến nghị phương án cơ khí phù hợp với quy mô sản xuất thực tế`,
                ],
                subheadings: autoSubs,
              };
            });

            setOutline(prev => ({
              ...prev,
              headings: expandedHeadings,
              h1: `Cẩm Nang Kỹ Thuật & Dàn Ý Chuyên Sâu: ${seedKeyword.toUpperCase()}`,
            }));
          }
          setIsGenerating(false);
        }, 300);
      };

      const copyMarkdown = () => {
        let md = `# ${outline.h1}\n\n`;
        md += `**Meta Title:** ${outline.metaTitle}\n`;
        md += `**Meta Description:** ${outline.metaDescription}\n\n`;
        md += `## Sapo\n${outline.sapo}\n\n`;
        outline.headings.forEach(h => {
          md += `## ${h.title}\n`;
          h.keyPoints?.forEach(kp => { md += `- ${kp}\n`; });
          h.subheadings?.forEach(sub => {
            md += `\n### ${sub.title}\n`;
            sub.keyPoints?.forEach(skp => { md += `  - ${skp}\n`; });
          });
          md += `\n`;
        });
        navigator.clipboard.writeText(md);
        setCopiedMd(true);
        setTimeout(() => setCopiedMd(false), 2000);
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto animate-fadeIn">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-200 mb-1">
                <Icon name="fileText" className="w-3.5 h-3.5" />
                Outline Builder (Hỗ trợ 2 Chế Độ Luân Phiên)
              </div>
              <h2 className="text-xl font-black text-slate-900">Trình Tạo Dàn Ý SEO B2B</h2>
              <p className="text-xs text-slate-500">
                Lên dàn ý từ từ khóa HOẶC tự nhập danh sách H2/H3 để AI tự động sáng tạo toàn bộ nội dung chi tiết bên dưới.
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={copyMarkdown}
                className="px-3 py-2 bg-white text-slate-700 border border-slate-200 rounded-lg text-xs font-bold hover:bg-slate-50 flex items-center gap-1.5 shadow-2xs"
              >
                <Icon name={copiedMd ? "check" : "copy"} className="w-3.5 h-3.5 text-blue-600" />
                <span>{copiedMd ? 'Đã sao chép MD' : 'Sao chép Markdown'}</span>
              </button>
            </div>
          </div>

          {/* DUAL MODE CONTROLLER */}
          <div className="bg-slate-900 text-white rounded-2xl p-5 shadow-md border border-slate-800 space-y-4">
            <div className="flex items-center gap-2 p-1 bg-slate-800 rounded-xl border border-slate-700 w-fit">
              <button
                onClick={() => setActiveMode('keyword')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                  activeMode === 'keyword' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                }`}
              >
                <Icon name="sparkles" className="w-3.5 h-3.5" />
                <span>1. Nhập từ khóa tạo Outline</span>
              </button>
              <button
                onClick={() => setActiveMode('custom_headings')}
                className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                  activeMode === 'custom_headings' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'
                }`}
              >
                <Icon name="penTool" className="w-3.5 h-3.5" />
                <span>2. Tự nhập khung H2/H3 (Tự sáng tạo H3 con)</span>
              </button>
            </div>

            {/* MODE 1 UI */}
            {activeMode === 'keyword' && (
              <div className="space-y-3">
                <span className="text-xs text-blue-200 font-bold">Nhập từ khóa để tự động lên dàn ý:</span>
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    value={customKeyword}
                    onChange={(e) => setCustomKeyword(e.target.value)}
                    placeholder="VD: phễu cấp liệu rung, băng tải inox thực phẩm..."
                    className="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-blue-400"
                  />
                  <button
                    onClick={handleGenerateOutline}
                    disabled={isGenerating}
                    className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition-all flex items-center gap-2 shrink-0"
                  >
                    <Icon name="wand" className="w-4 h-4 text-amber-300" />
                    <span>TẠO OUTLINE TỰ ĐỘNG</span>
                  </button>
                </div>
              </div>
            )}

            {/* MODE 2 UI */}
            {activeMode === 'custom_headings' && (
              <div className="space-y-4">
                <div className="p-3 bg-indigo-950/80 rounded-xl border border-indigo-500/40 text-xs text-indigo-100 flex items-start gap-2">
                  <Icon name="info" className="w-4 h-4 text-indigo-400 shrink-0 mt-0.5" />
                  <div>
                    <strong>Tính năng tự nhập H2, H3:</strong> Nếu bạn <strong>chỉ nhập thẻ H2</strong> mà để trống H3, khi bấm tạo thì hệ thống sẽ tự động phân tích và <strong>sáng tạo 2-3 thẻ H3 logic</strong> cùng toàn bộ nội dung nhỏ (key points), thông số kỹ thuật và FAQ Schema bên dưới!
                  </div>
                </div>

                <div className="space-y-3 max-h-80 overflow-y-auto pr-1">
                  {customH2List.map((h2, idx) => (
                    <div key={h2.id} className="p-3 bg-slate-800 rounded-xl border border-slate-700 space-y-2">
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 bg-indigo-600 text-white text-[10px] rounded font-bold">H2 #{idx + 1}</span>
                        <input
                          type="text"
                          value={h2.title}
                          onChange={(e) => {
                            const val = e.target.value;
                            setCustomH2List(prev => prev.map(item => item.id === h2.id ? { ...item, title: val } : item));
                          }}
                          className="flex-1 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700 text-xs text-white font-semibold focus:outline-none"
                        />
                        <button
                          onClick={() => handleRemoveH2(h2.id)}
                          className="text-slate-400 hover:text-rose-400 p-1"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                        </button>
                      </div>

                      {/* Subheadings */}
                      <div className="pl-6 space-y-1.5">
                        {h2.subheadings.map((sub, sIdx) => (
                          <div key={sIdx} className="flex items-center justify-between text-xs text-slate-300 bg-slate-900/60 px-2.5 py-1 rounded">
                            <span>H3: {sub}</span>
                            <button onClick={() => handleRemoveH3(h2.id, sIdx)} className="text-slate-500 hover:text-rose-400">×</button>
                          </div>
                        ))}
                        <div className="flex items-center gap-2">
                          <input
                            type="text"
                            value={newH3Input[h2.id] || ''}
                            onChange={(e) => setNewH3Input(prev => ({ ...prev, [h2.id]: e.target.value }))}
                            onKeyDown={(e) => e.key === 'Enter' && handleAddH3(h2.id)}
                            placeholder="+ Thêm H3 (hoặc để trống để AI tự sáng tạo)..."
                            className="flex-1 px-2 py-1 rounded bg-slate-900 text-[11px] text-slate-300 border border-slate-700 focus:outline-none"
                          />
                          <button
                            onClick={() => handleAddH3(h2.id)}
                            className="px-2 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded text-[11px]"
                          >
                            Thêm H3
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex items-center justify-between pt-1">
                  <button
                    onClick={handleAddH2}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-lg text-xs font-semibold border border-indigo-500/30 flex items-center gap-1.5"
                  >
                    <Icon name="plus" className="w-3.5 h-3.5" />
                    <span>Thêm Thẻ H2 Mới</span>
                  </button>

                  <button
                    onClick={handleGenerateOutline}
                    disabled={isGenerating || customH2List.length === 0}
                    className="px-5 py-2.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white rounded-xl text-xs font-bold transition-all flex items-center gap-2"
                  >
                    <Icon name="sparkles" className="w-4 h-4 text-amber-300" />
                    <span>TẠO OUTLINE TỪ DÀN Ý H2 NÀY</span>
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* OUTLINE DISPLAY */}
          <div className="bg-white rounded-2xl border border-slate-200 p-6 space-y-6 shadow-2xs">
            {/* Meta Tags */}
            <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">SERP SNIPPET PREVIEW (GOOGLE SEARCH)</span>
              <div className="text-xs text-slate-600 font-mono">https://chinhattu.com.vn › <strong className="text-slate-900">{outline.slug}</strong></div>
              <h3 className="text-base font-bold text-blue-700">{outline.metaTitle}</h3>
              <p className="text-xs text-slate-600">{outline.metaDescription}</p>
            </div>

            {/* H1 & Sapo */}
            <div className="space-y-2 border-b border-slate-100 pb-4">
              <span className="text-[10px] font-bold text-slate-400 uppercase">HEADING 1</span>
              <h1 className="text-2xl font-black text-slate-900">{outline.h1}</h1>
              <p className="text-xs text-slate-700 italic bg-slate-50 p-3.5 rounded-xl border border-slate-200/80 leading-relaxed mt-2">
                "{outline.sapo}"
              </p>
            </div>

            {/* Headings */}
            <div className="space-y-4">
              <span className="text-xs font-extrabold text-slate-900 uppercase tracking-wider flex items-center gap-2">
                <Icon name="layers" className="w-4 h-4 text-blue-600" />
                <span>Cấu Trúc Thân Bài (H2 & H3)</span>
              </span>

              <div className="space-y-4">
                {outline.headings.map((h2, idx) => (
                  <div key={idx} className="p-4 rounded-xl border border-slate-200 bg-white space-y-2.5">
                    <div className="flex items-center justify-between">
                      <div className="font-bold text-slate-900 text-sm flex items-center gap-2">
                        <span className="px-1.5 py-0.5 bg-slate-900 text-white rounded text-[10px] font-mono">H2</span>
                        <span>{h2.title}</span>
                      </div>
                      {h2.intentTarget && (
                        <span className="text-[10px] text-blue-700 bg-blue-50 px-2 py-0.5 rounded font-semibold border border-blue-200">
                          {h2.intentTarget}
                        </span>
                      )}
                    </div>

                    {/* Key points */}
                    {h2.keyPoints?.length > 0 && (
                      <ul className="space-y-1 pl-4 list-disc text-xs text-slate-600">
                        {h2.keyPoints.map((kp, kIdx) => (
                          <li key={kIdx}>{kp}</li>
                        ))}
                      </ul>
                    )}

                    {/* Subheadings H3 */}
                    {h2.subheadings?.map((h3, sIdx) => (
                      <div key={sIdx} className="ml-4 p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-1">
                        <div className="font-bold text-slate-800 text-xs flex items-center gap-1.5">
                          <span className="px-1 py-0.2 bg-indigo-600 text-white rounded text-[9px] font-mono">H3</span>
                          <span>{h3.title}</span>
                        </div>
                        {h3.keyPoints?.length > 0 && (
                          <ul className="space-y-0.5 pl-4 list-disc text-[11px] text-slate-500">
                            {h3.keyPoints.map((skp, skpIdx) => (
                              <li key={skpIdx}>{skp}</li>
                            ))}
                          </ul>
                        )}
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </div>

            {/* Spec Table */}
            {outline.technicalSpecsTable?.length > 0 && (
              <div className="space-y-2 pt-2 border-t border-slate-100">
                <span className="text-xs font-bold text-slate-900 uppercase tracking-wider">Bảng Thông Số Kỹ Thuật Khuyến Nghị</span>
                <table className="w-full text-xs text-left border border-slate-200 rounded-lg overflow-hidden">
                  <thead className="bg-slate-50 font-bold border-b border-slate-200">
                    <tr>
                      <th className="p-2.5">Thông Số</th>
                      <th className="p-2.5">Tiêu Chuẩn Khuyến Nghị</th>
                      <th className="p-2.5">Lưu Ý</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {outline.technicalSpecsTable.map((spec, sIdx) => (
                      <tr key={sIdx}>
                        <td className="p-2.5 font-bold text-slate-900">{spec.parameter}</td>
                        <td className="p-2.5 text-blue-700">{spec.recommended}</td>
                        <td className="p-2.5 text-slate-600">{spec.note}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}

            {/* FAQ */}
            {outline.faq?.length > 0 && (
              <div className="space-y-2 pt-2 border-t border-slate-100">
                <span className="text-xs font-bold text-slate-900 uppercase tracking-wider">Câu Hỏi Thường Gặp (FAQ Schema)</span>
                <div className="space-y-2">
                  {outline.faq.map((f, fIdx) => (
                    <div key={fIdx} className="p-3 bg-amber-50/40 rounded-xl border border-amber-200 text-xs space-y-1">
                      <div className="font-bold text-slate-900">Q: {f.question}</div>
                      <div className="text-slate-700 pl-3">A: {f.answer}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
